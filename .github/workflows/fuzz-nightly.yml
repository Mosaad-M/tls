name: Fuzz (nightly)
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Inputs per target"
        default: "300000"

jobs:
  fuzz:
    # Random seed each night (printed below, so a crash can be reproduced
    # with `pixi run fuzz <iterations> <seed>`), roughly 15 minutes.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Fuzz
        run: |
          SEED=$(( $(date +%s) % 1000000007 ))
          echo "seed $SEED"
          pixi run fuzz "${{ github.event.inputs.iterations || '300000' }}" "$SEED"

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: tests/fuzz/crashers/
