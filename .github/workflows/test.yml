name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check CPU features
        run: |
          echo "CPU model: $(grep 'model name' /proc/cpuinfo | head -1)"
          echo "CPU flags: $(grep '^flags' /proc/cpuinfo | head -1)"
          grep -q avx2 /proc/cpuinfo     || { echo "MISSING: avx2 — re-queue this job"; exit 1; }

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Run tests
        run: pixi run test
        # Note: test-connection, test-connection12, test-socket are excluded
        # from the composite task — they require local cert files and a
        # running Python TLS server. Run them manually with gen_test_certs.sh.

  test-soft-aes:
    # The software AES-GCM path (-D TLS_SOFT_AES=true): what builds for
    # targets without AES instructions use. The other jobs run on CPUs
    # with AES-NI / ARMv8 crypto, so they take the hardware path.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Software AES-GCM tests
        run: pixi run test-soft-aes

  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Run tests
        run: pixi run test

  interop:
    # Handshakes against openssl s_server (OpenSSL 3 from the pixi env):
    # cipher suites, P-256 ECDHE, mTLS, KeyUpdate. See tests/interop.sh.
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Interop tests
        run: pixi run test-interop

  fuzz:
    # Fixed seeds, about 3 minutes: every parser that sees peer bytes (see
    # tests/fuzz/run_fuzz.sh). A crash saves the input; it is uploaded below
    # and belongs in tests/fuzz/crashers/ with the fix. The nightly run in
    # fuzz-nightly.yml uses random seeds and a longer budget.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Fuzz
        run: pixi run fuzz 20000 1 2

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: tests/fuzz/crashers/
